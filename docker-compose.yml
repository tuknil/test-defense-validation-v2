# defense-validation: UI + API + Postgres as containers.
#
# The API resolves a defensive control candidate from a verified producer result
# and reports it; it runs no substrate and needs no Docker socket. The run ledger
# lives in the `db` Postgres container; its data is on the named volume `pgdata`,
# which survives `docker stop` and `docker rm` of the db container (only
# `docker compose down -v` deletes it).

services:
  db:
    image: artifact.it.att.com/astra-secure-container-catalog/postgresql:17.10-r1@sha256:c2ceffcba898b179fccfb526396f301a965fbd895d2b28e5484ed62789fac042
    container_name: defense-validation-db
    environment:
      POSTGRES_USER: mc
      POSTGRES_PASSWORD: mc
      POSTGRES_DB: mitigation
    volumes:
      - pgdata:/var/lib/postgresql/data      # durable ledger data
    networks:
      - dvnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc -d mitigation"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./api
    image: defense-validation-api
    container_name: defense-validation-api
    environment:
      PORT: "8137"
      GODEBUG: x509negativeserial=1
      DATABASE_URL: postgres://mc:mc@db:5432/mitigation?sslmode=disable
      # Ledger DB auth. Unset (default) uses DATABASE_URL above (password, local db
      # container). Set DATABASE_AUTH_MODE=entra to connect to Azure Database for
      # PostgreSQL with a Microsoft Entra ID token (reuses the AZURE_* creds below);
      # then provide DATABASE_HOST/NAME/USER (PORT/SSL_MODE default to 5432 /
      # verify-full). DATABASE_MIGRATION_MODE=external skips in-app schema creation.
      DATABASE_AUTH_MODE: ${DATABASE_AUTH_MODE:-}
      DATABASE_HOST: ${DATABASE_HOST:-}
      DATABASE_PORT: ${DATABASE_PORT:-}
      DATABASE_NAME: ${DATABASE_NAME:-}
      DATABASE_USER: ${DATABASE_USER:-}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-}
      DATABASE_MIGRATION_MODE: ${DATABASE_MIGRATION_MODE:-}
      AZURE_POSTGRES_TOKEN_SCOPE: ${AZURE_POSTGRES_TOKEN_SCOPE:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      DATABRICKS_DSN: ${DATABRICKS_DSN:-}
      DATABRICKS_CATALOG: ${DATABRICKS_CATALOG:-}
      DATABRICKS_SCHEMA: ${DATABRICKS_SCHEMA:-}
      DATABRICKS_TABLE: ${DATABRICKS_TABLE:-}
      CAPABILITY_CALLBACK_TOKEN: ${CAPABILITY_CALLBACK_TOKEN:-}
      CAPABILITY_CALLBACK_ALLOWED_HOSTS: ${CAPABILITY_CALLBACK_ALLOWED_HOSTS:-}
      XSIAM_HOST: ${XSIAM_HOST:-}
      XSIAM_API_KEY:  ${XSIAM_API_KEY:-}
      XDR_AUTH_ID: ${XDR_AUTH_ID:-}
    ports:
      - "8137:8137"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dvnet
    restart: unless-stopped

  ui:
    build: ./ui
    image: defense-validation-ui
    container_name: defense-validation-ui
    environment:
      API_BASE: ${API_BASE:-http://localhost:8137}
    ports:
      - "8082:80"
    depends_on:
      - api
    networks:
      - dvnet
    restart: unless-stopped

volumes:
  pgdata:

networks:
  dvnet:
    name: defense-validation-net
